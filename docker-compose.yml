version: '3.8'

services:
  ag-projects:
    build: .
    container_name: ag-projects-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      # - ALLOWED_ORIGIN=https://your-domain.example
    volumes:
      # Single persistent volume holds both the SQLite DB and uploaded files
      # (app writes database.db and uploads/ under DATA_DIR — see server.js)
      - app_data:/app/data

volumes:
  app_data:
